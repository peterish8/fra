name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  RESEARCH_FIXTURES_ONLY: "true"

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
      - name: Install pinned frontend dependencies
        run: |
          corepack enable
          corepack install --global yarn@4.12.0
          yarn install --immutable
      - name: Frontend lint
        run: yarn lint
      - name: Frontend typecheck
        run: yarn typecheck
      - name: Frontend tests
        run: yarn test
      - name: Frontend production build
        run: yarn build

  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install pinned backend dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -e ".[dev]"
      - name: Backend format check
        run: ruff format --check .
      - name: Backend lint
        run: ruff check .
      - name: Backend typecheck
        run: mypy app tests
      - name: Backend tests
        run: python -m pytest

  schema-and-api:
    name: Schema, migration, and OpenAPI validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -e ".[dev]"
          python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2 openapi-spec-validator==0.7.2
      - name: Migration and schema validation
        run: python -m pytest -q tests/persistence tests/security
      - name: OpenAPI parsing and validation
        run: python -c "from pathlib import Path; import yaml; from openapi_spec_validator import validate; spec = yaml.safe_load(Path('../docs/04-api/openapi.yaml').read_text(encoding='utf-8')); validate(spec); print('OpenAPI parsed and validated')"

  security:
    name: Secret and dependency scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Set up Node.js for dependency scan
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
      - name: Install pinned frontend dependencies for audit
        working-directory: frontend
        run: |
          corepack enable
          corepack install --global yarn@4.12.0
          yarn install --immutable
      - name: Frontend dependency scan
        working-directory: frontend
        run: yarn npm audit --all
      - name: Set up Python for dependency scan
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
      - name: Install pinned backend dependencies for audit
        working-directory: backend
        run: python -m pip install --disable-pip-version-check --no-cache-dir -e ".[dev]" pip-audit==2.9.0
      - name: Backend dependency scan
        working-directory: backend
        run: pip-audit --strict

  research-evaluation:
    name: Research evaluation smoke (fixture/local only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
      - name: Install pinned fixture-test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -e ".[dev]"
      - name: Run research evaluation smoke gates
        run: python -m pytest -q tests/test_ci_contract.py tests/persistence/test_schema_contract.py tests/security/test_rls_contract.py
