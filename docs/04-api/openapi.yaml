openapi: 3.1.0
info:
  title: Financial Research Agent API
  version: 1.0.0
  description: Core public contract. Detailed domain behavior lives in docs/.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /reports:
    get:
      summary: List reports
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: q
          schema: {type: string}
        - in: query
          name: status
          schema: {type: string, enum: [DRAFT, RESEARCHING, READY, VERIFIED, ARCHIVED]}
        - in: query
          name: company_id
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Report page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
    post:
      summary: Create report workspace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateReportRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSummary'}
  /reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      summary: Get report workspace
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportDetail'}
    delete:
      summary: Soft-delete report workspace
      responses:
        '204': {description: Deleted}
  /reports/{reportId}/research-runs:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      summary: Start research run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartResearchRequest'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResearchRunSummary'}
  /reports/{reportId}/thesis:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      summary: List analyst-authored thesis points for a report
      responses:
        '200':
          description: Owner-authorized thesis points
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ThesisPoint'}
    post:
      summary: Create a thesis proposition and falsifier
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ThesisPointCreate'}
      responses:
        '201':
          description: Created thesis point
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThesisPoint'}
  /reports/{reportId}/thesis/{thesisPointId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
      - in: path
        name: thesisPointId
        required: true
        schema: {type: string, format: uuid}
    patch:
      summary: Update analyst thesis posture without changing claim verdicts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ThesisPointUpdate'}
      responses:
        '200':
          description: Updated thesis point
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThesisPoint'}
  /reports/{reportId}/change-brief:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      summary: Return a cited earnings or filing change brief
      parameters:
        - in: query
          name: kind
          schema: {type: string, enum: [EARNINGS, FILING], default: EARNINGS}
      responses:
        '200':
          description: Owner-authorized cited change brief
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeBrief'}
  /reports/{reportId}/tearsheet:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      summary: Return a cited one-page report handoff
      responses:
        '200':
          description: Owner-authorized tearsheet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tearsheet'}
  /reports/{reportId}/refresh:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      summary: Refresh a living report
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: {type: string, enum: [FULL, AFFECTED_ONLY], default: AFFECTED_ONLY}
                sections: {type: array, items: {type: string}}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResearchRunSummary'}
  /research-runs/{runId}:
    get:
      summary: Get research progress
      parameters:
        - in: path
          name: runId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResearchRunDetail'}
  /companies/search:
    get:
      summary: Search canonical companies
      parameters:
        - in: query
          name: q
          required: true
          schema: {type: string, minLength: 2}
      responses:
        '200':
          description: Candidates
  /companies/resolve:
    post:
      summary: Resolve legal entity candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string}
                country_code: {type: string, minLength: 2, maxLength: 2}
                domain: {type: string}
                ticker: {type: string}
                exchange: {type: string}
                registry: {type: string}
                registry_id: {type: string}
                candidates:
                  type: array
                  maxItems: 100
                  items: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Resolution result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntityResolution'}
  /reports/{reportId}/versions:
    get:
      summary: List report versions
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200': {description: Versions}
  /reports/{reportId}/sources:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      summary: List retention-safe source lineage for a report
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: cursor
          schema: {type: string}
      responses:
        '200':
          description: Owner-authorized source page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSourcePage'}
  /reports/{reportId}/diff:
    get:
      summary: Compare report versions
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - in: query
          name: from
          required: true
          schema: {type: integer, minimum: 1}
        - in: query
          name: to
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200': {description: Diff}
  /reports/{reportId}/claims:
    get:
      summary: List report claims
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - in: query
          name: verdict
          schema: {$ref: '#/components/schemas/ClaimVerdict'}
      responses:
        '200': {description: Claims}
  /claims/{claimVersionId}:
    get:
      summary: Inspect claim
      parameters:
        - in: path
          name: claimVersionId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Claim detail}
  /claims/{claimVersionId}/evidence:
    get:
      summary: Inspect claim evidence
      parameters:
        - in: path
          name: claimVersionId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Evidence}
  /watchlists/latest:
    get:
      security: []
      summary: Get latest public research watchlist
      responses:
        '200': {description: Watchlist}
  /admin/usage-overview:
    get:
      summary: Return administrator-only account usage and research quota summary
      responses:
        '200':
          description: Privacy-minimised administrative usage overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsageOverview'
        '403':
          description: Verified identity lacks the administrator role claim
        '503':
          description: Administrative usage data is not configured
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ReportId:
      in: path
      name: reportId
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: {type: string, minLength: 8, maxLength: 128}
  schemas:
    ClaimVerdict:
      type: string
      enum: [UNVERIFIED, VERIFIED, PARTIALLY_SUPPORTED, CONTRADICTED, INSUFFICIENT_EVIDENCE, STALE]
    AdminUsageOverview:
      type: object
      required: [data_mode, generated_at, observation_window_hours, registered_users, active_users_in_window, research_runs_in_window, users]
      properties:
        data_mode: {type: string, enum: [FIXTURE, LIVE]}
        generated_at: {type: string, format: date-time}
        observation_window_hours: {type: integer, minimum: 1, maximum: 168}
        registered_users: {type: integer, minimum: 0}
        active_users_in_window: {type: integer, minimum: 0}
        research_runs_in_window: {type: integer, minimum: 0}
        users:
          type: array
          items: {$ref: '#/components/schemas/AdminUserUsage'}
    AdminUserUsage:
      type: object
      required: [user_id, display_name, role, research_runs_used, research_runs_limit, quota_status]
      properties:
        user_id: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [USER, ADMIN]}
        research_runs_used: {type: integer, minimum: 0}
        research_runs_limit: {type: integer, minimum: 1}
        quota_status: {type: string, enum: [AVAILABLE, NEARING_LIMIT, AT_LIMIT]}
    CreateReportRequest:
      type: object
      required: [title, subject]
      properties:
        title: {type: string, minLength: 1, maxLength: 180}
        subject:
          type: object
          required: [query]
          properties:
            query: {type: string}
            country_code: {type: string, minLength: 2, maxLength: 2}
            ticker: {type: string}
            domain: {type: string}
        focus: {type: array, items: {type: string}}
        depth: {type: string, enum: [FAST, STANDARD, DEEP], default: STANDARD}
        research_mode: {type: string, enum: [INITIATION, UPDATE, EARNINGS, EVENT, SECTOR, DILIGENCE], default: INITIATION}
    StartResearchRequest:
      type: object
      properties:
        depth: {type: string, enum: [FAST, STANDARD, DEEP], default: STANDARD}
        focus: {type: array, items: {type: string}}
        max_cost_usd: {type: number, minimum: 0}
    ReportSummary:
      type: object
      required: [report_id, title, status]
      properties:
        report_id: {type: string, format: uuid}
        title: {type: string}
        status: {type: string}
        current_version: {type: integer, nullable: true}
        updated_at: {type: string, format: date-time}
        research_mode: {type: string, enum: [INITIATION, UPDATE, EARNINGS, EVENT, SECTOR, DILIGENCE]}
    ReportDetail:
      allOf:
        - $ref: '#/components/schemas/ReportSummary'
        - type: object
          required: [subject, focus, depth]
          properties:
            subject:
              $ref: '#/components/schemas/ReportSubject'
            focus:
              type: array
              items: {type: string}
            depth: {type: string, enum: [FAST, STANDARD, DEEP]}
            company_id: {type: string, format: uuid, nullable: true}
            verification_gate: {$ref: '#/components/schemas/VerificationGate'}
    ThesisPointCreate:
      type: object
      required: [statement, falsifier]
      additionalProperties: false
      properties:
        statement: {type: string, minLength: 8, maxLength: 2000}
        falsifier: {type: string, minLength: 8, maxLength: 2000}
        materiality: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL], default: MEDIUM}
    ThesisPointUpdate:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [OPEN, SUPPORTED, WEAKENED, UNCHANGED]}
        review_note: {type: string, maxLength: 2000, nullable: true}
    ThesisPoint:
      allOf:
        - $ref: '#/components/schemas/ThesisPointCreate'
        - type: object
          required: [thesis_point_id, report_id, status, created_at, updated_at]
          properties:
            thesis_point_id: {type: string, format: uuid}
            report_id: {type: string, format: uuid}
            status: {type: string, enum: [OPEN, SUPPORTED, WEAKENED, UNCHANGED]}
            review_note: {type: string, nullable: true}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    EvidenceCitation:
      type: object
      required: [source_snapshot_id, source_label, excerpt, retrieved_at]
      properties:
        source_snapshot_id: {type: string, format: uuid}
        source_label: {type: string}
        excerpt: {type: string}
        retrieved_at: {type: string, format: date-time}
    ChangeBriefItem:
      type: object
      required: [direction, headline, why_it_matters, citations]
      properties:
        direction: {type: string, enum: [ADDED, UPDATED, WEAKENED, NEW_RISK, UNCHANGED]}
        headline: {type: string}
        why_it_matters: {type: string}
        claim_version_id: {type: string, format: uuid, nullable: true}
        citations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/EvidenceCitation'}}
    ChangeBrief:
      type: object
      required: [report_id, kind, title, as_of, items, limitations]
      properties:
        report_id: {type: string, format: uuid}
        kind: {type: string, enum: [EARNINGS, FILING]}
        title: {type: string}
        as_of: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/ChangeBriefItem'}}
        limitations: {type: array, items: {type: string}}
    TearsheetSection:
      type: object
      required: [label, summary, citations]
      properties:
        label: {type: string}
        summary: {type: string}
        citations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/EvidenceCitation'}}
    Tearsheet:
      type: object
      required: [report_id, title, as_of, research_mode, sections, limitations]
      properties:
        report_id: {type: string, format: uuid}
        title: {type: string}
        as_of: {type: string, format: date-time}
        research_mode: {type: string, enum: [INITIATION, UPDATE, EARNINGS, EVENT, SECTOR, DILIGENCE]}
        sections: {type: array, items: {$ref: '#/components/schemas/TearsheetSection'}}
        open_questions: {type: array, items: {type: string}}
        limitations: {type: array, items: {type: string}}
    ReportSubject:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1, maxLength: 200}
        country_code: {type: string, minLength: 2, maxLength: 2, nullable: true}
        ticker: {type: string, nullable: true}
        domain: {type: string, nullable: true}
    MatchReason:
      type: object
      required: [code, detail]
      properties:
        code: {type: string}
        detail: {type: string}
    EntityCandidate:
      type: object
      required: [company_id, canonical_name, entity_type, confidence, match_reasons, evidence_refs]
      properties:
        company_id: {type: string}
        canonical_name: {type: string}
        entity_type: {type: string}
        country_code: {type: string, nullable: true}
        primary_ticker: {type: string, nullable: true}
        primary_exchange: {type: string, nullable: true}
        confidence: {type: number, minimum: 0, maximum: 1}
        match_reasons: {type: array, items: {$ref: '#/components/schemas/MatchReason'}}
        evidence_refs: {type: array, items: {type: string}}
    EntityResolution:
      type: object
      required: [status, research_allowed, candidates]
      properties:
        status: {type: string, enum: [RESOLVED, AMBIGUOUS, UNCONFIRMED]}
        selected_company_id: {type: string, nullable: true}
        research_allowed: {type: boolean}
        abstention_reason: {type: string, nullable: true}
        candidates: {type: array, items: {$ref: '#/components/schemas/EntityCandidate'}}
        match_reasons: {type: array, items: {$ref: '#/components/schemas/MatchReason'}}
        evidence_refs: {type: array, items: {type: string}}
    ReportListResponse:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReportSummary'}
        next_cursor: {type: string, nullable: true}
    ResearchRunSummary:
      type: object
      required: [research_run_id, status]
      properties:
        research_run_id: {type: string, format: uuid}
        status: {type: string}
    ResearchRunDetail:
      allOf:
        - $ref: '#/components/schemas/ResearchRunSummary'
        - type: object
          properties:
            stage: {type: string, nullable: true}
            progress: {type: object, additionalProperties: true}
            estimated_cost_usd: {type: number}
            degradation: {type: array, items: {type: string}}
    SourceSnapshotSummary:
      type: object
      required: [snapshot_id, retrieved_at, content_hash, retention_mode]
      properties:
        snapshot_id: {type: string, format: uuid}
        retrieved_at: {type: string, format: date-time}
        published_at: {type: string, format: date-time, nullable: true}
        content_hash: {type: string}
        retention_mode: {type: string, enum: [FULL_TEXT, EXCERPT_ONLY, METADATA_ONLY, STORAGE_REFERENCE]}
        provider_request_id: {type: string, format: uuid, nullable: true}
    ReportSourceSummary:
      type: object
      required: [source_id, identity_key, publisher, source_type, authority_tier, ownership_relation, latest_snapshot]
      properties:
        source_id: {type: string, format: uuid}
        identity_key: {type: string}
        canonical_url: {type: string, nullable: true}
        publisher: {type: string}
        domain: {type: string, nullable: true}
        source_type: {type: string}
        authority_tier: {type: string}
        ownership_relation: {type: string}
        source_family_id: {type: string, format: uuid, nullable: true}
        source_family_reason: {type: string, nullable: true}
        latest_snapshot: {$ref: '#/components/schemas/SourceSnapshotSummary'}
    ReportSourcePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReportSourceSummary'}}
        next_cursor: {type: string, nullable: true}
    VerificationGate:
      type: object
      required: [passed, citation_coverage, blocking_claims, critical_conflicts, reasons]
      properties:
        passed: {type: boolean}
        citation_coverage: {type: number, minimum: 0, maximum: 100}
        blocking_claims: {type: integer, minimum: 0}
        critical_conflicts: {type: integer, minimum: 0}
        reasons: {type: array, items: {type: string}}
        blockers: {type: array, items: {type: string}}
